<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LOI Status | Carapace</title>
  <meta name="theme-color" content="#090c18" />
  <style>
    :root { --bg:#070b16; --surface:#101a31; --text:#edf1ff; --muted:#a7b3d3; --border:#253554; --max:860px; }
    *{box-sizing:border-box;} html,body{margin:0;padding:0;} body{font:16px/1.62 Inter,Segoe UI,Roboto,system-ui,sans-serif;background:linear-gradient(180deg,#0b1122 0%,var(--bg) 100%);color:var(--text);} a{color:#22d3ee;text-decoration:none;}
    .wrap{width:min(100% - 2rem,var(--max));margin:0 auto;} .hero{padding:4rem 0 1.8rem;} h1{margin:.3rem 0 .9rem;line-height:1.04;font-size:clamp(2rem,4.8vw,3.2rem);letter-spacing:-.03em;} .lead{color:var(--muted);max-width:60ch;margin:0 0 1rem;font-size:1.05rem;} .card{border:1px solid var(--border);border-radius:16px;background:linear-gradient(180deg,rgba(16,26,48,.94),rgba(14,22,40,.9));padding:1.2rem;box-shadow:0 10px 28px rgba(0,0,0,.14);} .cta{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:1rem;} .btn{display:inline-flex;align-items:center;justify-content:center;border-radius:11px;border:1px solid transparent;font-weight:700;letter-spacing:.03em;font-size:.84rem;padding:.84rem 1.08rem;text-transform:uppercase;} .btn.outline{color:#dce8ff;border-color:#334566;background:rgba(15,22,38,.74);} .muted{color:var(--muted);} 
  </style>
  <link rel="stylesheet" href="assets/site.css?v=20260619" />
</head>
<body class="page-business">
  <main class="wrap">
    <header class="hero">
      <h1 id="title">Thanks for your interest.</h1>
      <p id="lead" class="lead">We received your request and we’ll follow up from here.</p>
    </header>
    <section class="card">
      <p id="body-copy" class="muted">If you signed the non-binding letter of intent, that helps us prioritize early access and pilot conversations. If you skipped it, no problem. We still have your request.</p>
      <div class="cta"><a class="btn outline" href="business.html">Back to Business Page</a><a class="btn outline" href="index.html">Home</a></div>
    </section>
  </main>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      if (params.get('signed') === '1') {
        document.getElementById('title').textContent = 'Your non-binding LOI has been recorded.';
        document.getElementById('lead').textContent = 'Thanks for taking the extra step to show early access interest.';
        document.getElementById('body-copy').textContent = 'We saved your signed, non-binding letter of intent and can use it to prioritize follow-up around pilots, early access, or implementation conversations.';
        return;
      }
      if (params.get('skipped') === '1') {
        document.getElementById('title').textContent = 'Thanks, your request is still in the queue.';
        document.getElementById('lead').textContent = 'You skipped the optional letter of intent, which is completely fine.';
        document.getElementById('body-copy').textContent = 'We still received your request and can follow up from there. The letter of intent is non-binding and optional, so skipping it does not remove your interest from consideration.';
      }
    })();
  </script>
  <script src="assets/cortex-bloom-bg.js"></script>
  <script src="assets/hero-social.js?v=20260706"></script>
  <script src="assets/site.js?v=20260706"></script>
</body>
</html>
