<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>You Can Build It Now, Carapace workshop</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="../assets/carapace_logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/deck.css" />
</head>
<body>
  <div id="frame">
    <div id="stage">
      <div id="slides"></div>
      <div id="notes" aria-live="polite"></div>
    </div>
    <div id="hud">
      <div id="progress"><span></span></div>
      <div id="hint">Click or →  ·  F fullscreen  ·  N notes</div>
      <div class="pager" id="pager">
        <button type="button" class="pager-btn" id="prev-btn" aria-label="Previous slide">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>
        </button>
        <div class="rail"></div>
        <button type="button" class="pager-btn" id="next-btn" aria-label="Next slide">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 5.5 16 12l-6.5 6.5"/></svg>
        </button>
      </div>
    </div>
  </div>
  <script src="js/slides.js"></script>
  <script src="js/deck.js"></script>
</body>
</html>
