<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carapace | Own Your Intelligence</title>
  <style>
    :root {
      --bg: #030712;
      --sky: #7dd3fc;
      --violet: #a78bfa;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      background: var(--bg);
      color: white;
      font-family: Inter, system-ui, sans-serif;
      overflow-x: hidden;
    }

    canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .background-glow {
      position: fixed;
      inset: 0;
      z-index: 1;
      background: radial-gradient(circle at 50% 32%, rgba(14, 165, 233, 0.2), transparent 38%),
                  radial-gradient(circle at 80% 76%, rgba(168, 85, 247, 0.12), transparent 36%);
      pointer-events: none;
    }

    .grain {
      position: fixed;
      inset: 0;
      z-index: 2;
      opacity: 0.04;
      background-image: radial-gradient(circle, #fff 0.55px, transparent 0.55px);
      background-size: 3.5px 3.5px;
      pointer-events: none;
    }

    .hero-stage {
      position: relative;
      height: 520vh;
    }

    .pinned {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 30;
      padding: 42px 26px;
      text-align: center;
      width: var(--insight-width, min(1280px, 92%));
      background: transparent;
      border: none;
      border-radius: 16px;
      backdrop-filter: blur(30px);
    }

    .card {
      width: min(1280px, 92%);
      padding: 16px 8px;
    }

    @media (max-width: 640px) {
      .pinned { padding: 22px 10px; }
      h1 { font-size: clamp(2.05rem, 8.8vw, 3.2rem); }
    }

    .eyebrow {
      color: var(--sky);
      font-size: 0.74rem;
      font-weight: 800;
      letter-spacing: 0.38em;
      text-transform: uppercase;
      margin-bottom: 6px;
      opacity: 0.7;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(2.35rem, 7.2vw, 6.6rem);
      line-height: 0.82;
      letter-spacing: -0.11em;
      font-weight: 950;
    }

    .sub {
      max-width: 720px;
      margin: 0 auto 8px;
      font-size: clamp(1.05rem, 2.4vw, 1.8rem);
      line-height: 1.26;
      color: rgba(224, 242, 254, 0.84);
    }

    .note {
      max-width: 640px;
      margin: 0 auto;
      color: rgba(255, 255, 255, 0.5);
      font-size: 0.94rem;
      line-height: 1.6;
    }

    .proof-row {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 16px;
    }

    .proof {
      border: 1px solid rgba(255,255,255,0.04);
      background: rgba(15, 23, 42, 0.3);
      border-radius: 999px;
      padding: 2px 9px;
      font-size: 0.72rem;
      font-weight: 700;
      backdrop-filter: blur(3px);
    }

    .progress {
      position: fixed;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      z-index: 50;
      width: min(280px, calc(100vw - 24px));
      height: 1.5px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress span {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, var(--sky), var(--violet));
      transition: width 45ms linear;
    }

    .contact {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 50px 20px;
      background: linear-gradient(to bottom, transparent, #020617 4%);
    }

    .contact-panel {
      max-width: 820px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.03);
      border-radius: 20px;
      padding: 36px 24px;
      background: rgba(15, 23, 42, 0.58);
      backdrop-filter: blur(10px);
    }

    .contact h2 {
      margin: 0 0 8px;
      font-size: clamp(1.85rem, 4.5vw, 3.6rem);
      line-height: 0.84;
      font-weight: 950;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 11px 18px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--sky), var(--violet));
      color: #020617;
      text-decoration: none;
      font-weight: 900;
      font-size: 0.94rem;
      box-shadow: 0 0 26px rgba(125, 211, 252, 0.2);
      transition: transform 120ms ease;
    }

    .cta:hover { transform: translateY(-0.5px); }

    footer {
      padding: 26px 20px 32px;
      font-size: 0.76rem;
      line-height: 1.45;
      color: rgba(255, 255, 255, 0.58);
      border-top: 1px solid rgba(255, 255, 255, 0.03);
      background: #020617;
    }
  </style>
</head>

<body>
  <canvas id="canvas"></canvas>
  <div class="background-glow"></div>
  <div class="grain"></div>

  <main>
    <section class="hero-stage">
      <div class="pinned">
        <div id="insight" class="card"></div>
      </div>
    </section>

    <!-- CTA treated as the final narrative stage -->
    <section class="contact" id="cta-section">
      <div class="contact-panel">
        <div style="color:#7dd3fc; font-weight:800; letter-spacing:0.3em; font-size:0.74rem; margin-bottom:6px; opacity:0.85;">
          NEXT STEP
        </div>
        <h2>Ready to own<br>your intelligence?</h2>
        <p style="max-width:520px; margin:0 auto 16px; color:rgba(224,242,254,0.75); font-size:0.98rem; line-height:1.4;">
          Start with a focused Discovery Sprint.<br>
          Map friction. Prototype value. Measure savings.
        </p>
        <a href="mailto:hello@carapace.ai?subject=Carapace%20Discovery%20Sprint" class="cta">
          Book the Discovery Sprint →
        </a>
      </div>
    </section>
  </main>

  <div class="progress"><span id="progressFill"></span></div>

  <footer>
    <div style="max-width:1000px; margin:0 auto; padding:0 20px; display:flex; flex-wrap:wrap; gap:12px; justify-content:space-between; align-items:center; font-size:0.74rem;">
      <div>
        <strong style="color:#fff;">Carapace LLC</strong> · Makers of Cortex
      </div>
      <div style="opacity:0.55;">
        Sources: Asana Anatomy of Work • IDC 2024 (Microsoft) • Adecco 2024 • LSE/Protiviti
      </div>
    </div>
  </footer>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d", { alpha: true });
    const insightEl = document.getElementById("insight");
    const progressFill = document.getElementById("progressFill");

    let width = 0, height = 0, particles = [], progress = 0, activeIndex = -1;
    let targetParticleCount = 0;
    let prefersReducedMotion = false;
    let lastScrollY = 0;
    let scrollVelocity = 0;
    let mouse = { x: null, y: null, active: false };

    const slides = [
      { eyebrow: "Carapace Cortex", title: "Own Your Intelligence", sub: "Build a private AI layer around your business.", note: "Your data. Your workflows. Your control.", proof: ["Private", "Model-independent", "No lock-in"] },
      { eyebrow: "The Hidden Tax", title: "60% of Team Time", sub: "Knowledge workers spend most of their day on “work about work.”", note: "Hundreds of hours per person, per year.", proof: ["Asana", "664 hrs/yr"] },
      { eyebrow: "The Problem", title: "Stop Using People as Glue", sub: "Humans become the connective tissue between systems.", note: "Carapace targets repeated handoffs and loops.", proof: ["Less routing", "Less copy/paste"] },
      { eyebrow: "The Layer", title: "Private AI Infrastructure", sub: "A business-owned automation layer that connects tools.", note: "Reusable operational intelligence.", proof: ["Your workflows", "Your knowledge"] },
      { eyebrow: "The Business Case", title: "Replace SaaS Waste", sub: "Build workflows that compound inside your organization.", note: "Savings from reduced overhead.", proof: ["Consolidation", "Automation"] },
      { eyebrow: "The ROI Signal", title: "3.7× Average ROI", sub: "IDC reported $3.70 return per $1 invested in AI.", note: "Stronger when connected to real workflows.", proof: ["IDC / Microsoft"] },
      { eyebrow: "The Time Dividend", title: "5-7+ Hours Back", sub: "Meaningful weekly time savings with trained AI.", note: "Focus on summaries, routing, and repetitive decisions.", proof: ["Adecco", "LSE"] },
      { eyebrow: "The Entry Point", title: "Start Small. Prove Value.", sub: "Begin with a focused Discovery Sprint.", note: "One measurable wedge at a time.", proof: ["Discovery Sprint", "Measurable wins"] }
    ];

    let particlePresets = [
      { mode: 'cosmicDrift', baseHue: 195, speedMultiplier: 0.72, interactionMode: 'focusField', particleCountMultiplier: 1.06, connectionDistance: 52, connectionOpacity: 0.06, centerHaze: 0.17 },
      { mode: 'upward', baseHue: 265, speedMultiplier: 0.55, interactionMode: 'subtleAttract', particleCountMultiplier: 0.9, connectionDistance: 0, centerHaze: 0.12 },
      { mode: 'horizontalFlow', baseHue: 175, speedMultiplier: 0.78, interactionMode: 'ripple', particleCountMultiplier: 1.18, connectionDistance: 42, connectionOpacity: 0.055, centerHaze: 0.13 },
      { mode: 'vortex', baseHue: 285, speedMultiplier: 0.38, interactionMode: 'orbit', particleCountMultiplier: 0.96, connectionDistance: 36, connectionOpacity: 0.09, centerHaze: 0.11, rotationAmount: 0.024 },
      { mode: 'radiate', baseHue: 15, speedMultiplier: 0.58, interactionMode: 'repel', particleCountMultiplier: 1.22, connectionDistance: 0, centerHaze: 0.14 },
      { mode: 'orbitCluster', baseHue: 145, speedMultiplier: 0.36, interactionMode: 'orbit', particleCountMultiplier: 1.08, connectionDistance: 68, connectionOpacity: 0.07, centerHaze: 0.12 },
      { mode: 'chaoticJitter', baseHue: 320, speedMultiplier: 0.82, interactionMode: 'ripple', particleCountMultiplier: 1.32, connectionDistance: 26, connectionOpacity: 0.045, centerHaze: 0.15 },
      { mode: 'floatingField', baseHue: 210, speedMultiplier: 0.22, interactionMode: 'magnetize', particleCountMultiplier: 0.8, connectionDistance: 72, connectionOpacity: 0.08, centerHaze: 0.11 }
    ];

    let currentParticlePreset = particlePresets[0];

    class Particle {
      constructor() {
        this.reset();
        this.angle = Math.random() * Math.PI * 2;
        this.life = 1;
        this.vx = (Math.random() - 0.5) * 0.5;
        this.vy = 0;
        this.focusIntensity = 0;
      }

      reset() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.size = Math.random() * 1.9 + 0.82;
        this.hueOffset = Math.random() * (currentParticlePreset.hueRange || 28);
        this.life = 1;
        this.angle = Math.random() * Math.PI * 2;
        this.vx = (Math.random() - 0.5) * 0.58;
        this.vy = Math.random() * 0.22 + 0.11;
        this.focusIntensity = 0;
      }

      update() {
        const preset = currentParticlePreset;
        const m = preset.mode || 'fall';
        let speedMod = (preset.speedMultiplier || 1) * (1 + progress * 1.2);
        if (prefersReducedMotion) speedMod *= 0.38;

        this.vx += (Math.random() - 0.5) * 0.016;
        this.vy += (Math.random() - 0.5) * 0.012;

        if (m === 'cosmicDrift') {
          const t = Date.now() * 0.00135;
          this.vy = 0.52 * speedMod;
          this.vx = Math.sin(this.x * 0.0085 + t * 0.4 + this.angle) * 1.25 * 0.4 + (Math.random()-0.5)*0.06;
        } else if (m === 'upward') {
          this.vy = -0.45 * speedMod;
          this.vx += Math.sin(this.y * 0.0065 + Date.now() * 0.0006) * 0.85 * 0.26;
          this.vx *= 0.93;
        } else if (m === 'horizontalFlow') {
          this.vx = 0.75 * speedMod * (Math.sin(this.y * 0.0045) * 0.55 + 0.8);
          this.vy = Math.sin(this.x * 0.007 + Date.now() * 0.0008) * 0.25 * speedMod;
          this.vx *= 0.94;
        } else if (m === 'vortex') {
          const cx = width / 2;
          const cy = height / 2;
          const dx = cx, this.x;
          const dy = cy, this.y;
          const dist = Math.sqrt(dx * dx + dy * dy) || 1;
          const pull = 0.65 / Math.max(dist, 24);
          this.vx += dx * pull * speedMod;
          this.vy += dy * pull * speedMod;
          const rot = (preset.rotationAmount || 0.024);
          this.vx += dy * rot * 0.7;
          this.vy -= dx * rot * 0.7;
          if (dist < 14) {
            this.vx += dy * 1.15 * 0.009 * speedMod;
            this.vy -= dx * 1.15 * 0.009 * speedMod;
          }
        } else if (m === 'radiate') {
          const cx = width / 2;
          const cy = height / 2;
          const dx = this.x, cx;
          const dy = this.y, cy;
          const d = Math.sqrt(dx * dx + dy * dy) || 1;
          this.vx = (dx / d) * 0.88 * speedMod;
          this.vy = (dy / d) * 0.88 * speedMod;
        } else if (m === 'orbitCluster') {
          const angleSpeed = (preset.rotationAmount || 0.006) * speedMod;
          this.angle += angleSpeed;
          const r = 38 + Math.sin(this.angle * 0.34) * 18;
          const tx = width / 2 + Math.cos(this.angle * 0.55) * r * 1.5;
          const ty = height / 2 + Math.sin(this.angle * 0.75) * r * 0.75;
          this.vx = (tx, this.x) * 0.028 * speedMod;
          this.vy = (ty, this.y) * 0.028 * speedMod;
        } else if (m === 'chaoticJitter') {
          const j = 1.85;
          this.vx += (Math.random() - 0.5) * j * speedMod * 1.05;
          this.vy += (Math.random() - 0.5) * j * speedMod * 0.55;
          this.vx *= 0.81;
          this.vy *= 0.82;
        } else {
          this.vy = 0.68 * speedMod;
          this.vx *= 0.88;
        }

        this.x += this.vx;
        this.y += this.vy;

        if (this.y > height + 28 || this.y < -28 || this.x < -18 || this.x > width + 18 || this.life <= 0) {
          this.reset();
        }

        if (mouse.active && mouse.x !== null) {
          const dx = mouse.x, this.x;
          const dy = mouse.y, this.y;
          const dist = Math.sqrt(dx * dx + dy * dy) || 1;

          if (preset.interactionMode === 'focusField') {
            const r = preset.focusRadius || 170;
            if (dist < r) {
              const inf = (1, dist / r) * (preset.focusStrength || 0.52);
              this.vx *= (1, inf * 0.55);
              this.vy *= (1, inf * 0.5);
              this.vx += (dx / dist) * inf * 0.3;
              this.vy += (dy / dist) * inf * 0.3;
              this.focusIntensity = inf;
            } else {
              this.focusIntensity = 0;
            }
          } else if (preset.interactionMode === 'magnetize' && dist < 260) {
            const mag = (1, dist / 260) * 1.15;
            this.vx += (dx / dist) * mag;
            this.vy += (dy / dist) * mag;
          }
        } else {
          this.focusIntensity = 0;
        }

        const sv = scrollVelocity * (preset.scrollReactivity ?? 0.8);
        this.vy += sv * 0.0085;
        this.vx += sv * 0.0028;

        this.vx *= 0.976;
        this.vy *= 0.976;
      }

      draw() {
        const preset = currentParticlePreset;
        let hue = (preset.baseHue || 195) + (this.hueOffset || 0);
        let alpha = 0.42 + (this.life || 1) * 0.48;
        let size = this.size;

        const focus = this.focusIntensity || 0;
        if (focus > 0.04) {
          hue += 14 * focus;
          alpha += focus * 0.2;
          size *= (1 + focus * 0.38);
        }

        const cx = width / 2;
        const cy = height / 2;
        const distFromCenter = Math.hypot(this.x, cx, this.y, cy);
        const maxD = Math.min(width, height) * 0.42;
        const depth = Math.max(0.6, 1 - (distFromCenter / maxD) * 0.5);

        alpha *= (0.72 + depth * 0.35);
        size *= (0.92 + depth * 0.24);

        const pulse = Math.sin(Date.now() * 0.0013 + this.x * 0.016) * 0.05 + 1;
        size *= pulse;

        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.fillStyle = `hsla(${hue}, 83%, 87%, ${Math.min(alpha, 0.82)})`;
        ctx.beginPath();
        ctx.arc(0, 0, size, 0, Math.PI * 2);
        ctx.fill();

        if (focus > 0.05 || depth > 0.7) {
          ctx.fillStyle = `hsla(${hue}, 90%, 88%, ${focus > 0.05 ? 0.09 + focus * 0.1 : 0.035})`;
          ctx.beginPath();
          ctx.arc(0, 0, size * (focus > 0.05 ? 1.85 : 1.5), 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }
    }

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;

      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      canvas.style.width = `${width}px`;
      canvas.style.height = `${height}px`;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const base = Math.floor((width * height) / 8500) + 42;
      targetParticleCount = Math.floor(base * (currentParticlePreset.particleCountMultiplier || 1));
      particles = Array.from({ length: Math.min(targetParticleCount, 125) }, () => new Particle());
    }

    function adjustPopulation() {
      let desired = targetParticleCount;
      if (prefersReducedMotion) desired = Math.floor(desired * 0.3);
      const diff = desired, particles.length;

      if (diff > 0) {
        const add = Math.min(diff, prefersReducedMotion ? 1 : 3);
        for (let i = 0; i < add; i++) {
          const p = new Particle();
          p.life = 0.1 + Math.random() * 0.2;
          particles.push(p);
        }
      } else if (diff < 0) {
        particles.splice(particles.length, Math.min(-diff, prefersReducedMotion ? 1 : 2), Math.min(-diff, prefersReducedMotion ? 1 : 2));
      }
    }

    function setParticlePreset(index) {
      if (!particlePresets[index]) return;
      currentParticlePreset = particlePresets[index];
      const base = Math.floor((width * height) / 8500) + 42;
      targetParticleCount = Math.floor(base * (currentParticlePreset.particleCountMultiplier || 1));
    }

    function animate() {
      ctx.fillStyle = "rgba(3,7,18,0.075)";
      ctx.fillRect(0, 0, width, height);

      adjustPopulation();
      particles.forEach(p => { p.update(); p.draw(); });

      const preset = currentParticlePreset;
      const baseHaze = preset.centerHaze ?? 0.13;
      const scrollBoost = Math.min(Math.abs(scrollVelocity) * 0.0055, 0.07);
      const haze = Math.max(0.035, baseHaze + scrollBoost);

      const cx = width / 2;
      const cy = height / 2;
      const inner = Math.min(width, height) * 0.12;
      const outer = Math.min(width, height) * 0.68;

      const grad = ctx.createRadialGradient(cx, cy, inner, cx, cy, outer);
      grad.addColorStop(0, `rgba(3,7,18,${haze * 0.78})`);
      grad.addColorStop(0.32, `rgba(3,7,18,${haze * 0.24})`);
      grad.addColorStop(1, 'rgba(3,7,18,0)');

      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, width, height);

      requestAnimationFrame(animate);
    }

    function update() {
      progress = Math.min(window.scrollY / (document.documentElement.scrollHeight, window.innerHeight || 1), 1);
      progressFill.style.width = `${progress * 100}%`;

      const curY = window.scrollY || 0;
      scrollVelocity = scrollVelocity * 0.55 + (curY, lastScrollY) * 0.45;
      lastScrollY = curY;

      const idx = Math.min(slides.length - 1, Math.floor(progress * slides.length));
      if (idx !== activeIndex) {
        activeIndex = idx;
        renderSlide(idx);
        setParticlePreset(idx);
      }

      const pinned = document.querySelector('.pinned');
      if (pinned) {
        if (progress > 0.80) {
          pinned.style.transition = 'opacity 0.22s ease';
          pinned.style.opacity = '0';
          pinned.style.pointerEvents = 'none';
        } else {
          pinned.style.opacity = '1';
          pinned.style.pointerEvents = 'auto';
        }
      }
    }

    function renderSlide(i) {
      const s = slides[i];
      if (!s) return;

      insightEl.innerHTML = `
        <div>
          <div class="eyebrow">${s.eyebrow}</div>
          <h1>${s.title.split(' ').map((w,j) => `<span class="word" style="animation-delay:${j*24}ms">${w}</span>`).join(' ')}</h1>
          <p class="sub">${s.sub}</p>
          <p class="note">${s.note}</p>
          <div class="proof-row">${s.proof.map(p => `<span class="proof">${p}</span>`).join('')}</div>
        </div>
      `;

      insightEl.querySelectorAll('.word').forEach((w, j) => {
        w.style.opacity = '0';
        w.style.transform = 'translateY(14px)';
        setTimeout(() => {
          w.style.transition = `all ${0.4 + j*0.022}s cubic-bezier(0.23,1,0.32,1)`;
          w.style.opacity = '1';
          w.style.transform = 'translateY(0)';
        }, j * 26);
      });
    }

    function init() {
      prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      window.addEventListener('resize', () => { resize(); update(); });
      window.addEventListener('scroll', () => requestAnimationFrame(update), { passive: true });

      window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true; });
      window.addEventListener('touchmove', e => { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; mouse.active = true; }, { passive: true });
      window.addEventListener('mouseleave', () => mouse.active = false);
      window.addEventListener('touchend', () => mouse.active = false);

      resize();
      renderSlide(0);
      setParticlePreset(0);
      animate();
      update();
    }

    init();
  </script>
</body>
</html>
