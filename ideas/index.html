<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Carapace / Cortex Fullscreen Pitch Deck</title>
<meta name="description" content="The Carapace / Cortex pitch deck: private, governed, model-independent AI infrastructure for organizations." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700;800;850&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #05070b;
  --text: #f3f7ff;
  --muted: rgba(243,247,255,.76);
  --soft: rgba(243,247,255,.50);
  --line: rgba(255,255,255,.12);
  --aqua: #67f1e2;
  --copper: #d29a67;
  --panel: rgba(5,7,11,.86);
  --ease: cubic-bezier(.2,.84,.18,1);
}
* { box-sizing: border-box; }
html, body { margin:0; width:100%; height:100%; background:var(--bg); color:var(--text); font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; overflow:hidden; }
body::before { content:""; position:fixed; inset:0; z-index:20; pointer-events:none; background:radial-gradient(circle at 12% 8%, rgba(103,241,226,.16), transparent 31%), radial-gradient(circle at 86% 88%, rgba(210,154,103,.13), transparent 33%), linear-gradient(135deg, rgba(255,255,255,.045), transparent 38%, rgba(103,241,226,.04)); mix-blend-mode:screen; opacity:.82; }
.deck { position:relative; width:100vw; height:100dvh; overflow:hidden; background:#05070b; }
.slides { position:absolute; inset:0; }
.slide { position:absolute; inset:0; width:100vw; height:100dvh; visibility:hidden; opacity:0; transform:translate3d(0,100%,0); transition:transform 780ms var(--ease), opacity 460ms ease, visibility 460ms; will-change:transform, opacity; }
.slide.is-current, .slide.is-next, .slide.is-prev { visibility:visible; opacity:1; }
.slide.is-current { transform:translate3d(0,0,0); z-index:3; }
.slide.is-prev { transform:translate3d(0,-100%,0); z-index:1; }
.slide.is-next { transform:translate3d(0,100%,0); z-index:2; opacity:1; }
.slide-media, .blur-bg, .image-plane, .explainer, .vignette, .slide-img { position:absolute; inset:0; }
.slide-media { overflow:hidden; background:#05070b; }
.blur-bg { z-index:0; width:100%; height:100%; object-fit:cover; transform:scale(1.08); filter:blur(30px) brightness(.34) saturate(.95); opacity:.82; transition:filter 360ms ease; }
.image-plane { z-index:2; display:grid; place-items:center; background:transparent; transition:transform 1100ms var(--ease), filter 900ms ease, opacity 900ms ease; transform:translate3d(calc(var(--rshift, 0vw) + var(--px, 0px)), var(--py, 0px), 0); filter:brightness(var(--brightness,1)) saturate(var(--saturation,1)); will-change:transform, filter; }
.slide-img { width:100vw; height:100dvh; object-fit:contain; object-position:center center; transform:scale(var(--imgScale,1.006)); filter:drop-shadow(0 28px 70px rgba(0,0,0,.42)); }
.vignette { z-index:4; pointer-events:none; background:linear-gradient(to bottom, rgba(0,0,0,.42), transparent 19%, transparent 69%, rgba(0,0,0,.62)), linear-gradient(to right, rgba(0,0,0,.30), transparent 28%, transparent 62%, rgba(0,0,0,.58)); opacity:var(--vignetteOpacity,.84); transition:opacity 900ms ease; }
.explainer { z-index:3; display:flex; justify-content:flex-end; pointer-events:none; background:linear-gradient(to right, transparent 0%, rgba(5,7,11,.08) 37%, rgba(5,7,11,.72) 62%, rgba(5,7,11,.96) 100%); opacity:var(--panelOpacity,0); transition:opacity 900ms ease; }
.explainer-inner { width:min(49rem, 48vw); height:100%; padding:clamp(4.8rem,7.5vh,6.8rem) clamp(2.1rem,4.1vw,5rem) clamp(5.4rem,8vh,7.2rem); display:flex; flex-direction:column; justify-content:center; transform:translateX(var(--innerX, 15vw)); opacity:var(--innerOpacity,0); transition:transform 1100ms var(--ease), opacity 900ms ease; overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; pointer-events:auto; scrollbar-width:thin; scrollbar-color:rgba(103,241,226,.45) transparent; }
.kicker { color:var(--aqua); letter-spacing:.16em; text-transform:uppercase; font-size:.70rem; font-weight:800; margin-bottom:1rem; }
.explainer h1 { font-family:"Instrument Serif", Georgia, serif; font-weight:400; font-size:clamp(2.2rem,4vw,4.75rem); line-height:.95; letter-spacing:-.037em; margin:0 0 1.2rem; max-width:13ch; }
.copy { max-width:48rem; font-size:clamp(.98rem,1.18vw,1.13rem); line-height:1.58; color:var(--muted); text-wrap:pretty; }
.copy p { margin:0 0 1rem; }
.copy p:last-child { margin-bottom:0; }
.copy strong { color:var(--text); font-weight:700; }
.explainer-inner .kicker, .explainer-inner h1, .explainer-inner .copy { opacity:0; transform:translateY(20px); will-change:opacity, transform, filter; }
.slide.is-explaining .explainer-inner .kicker { animation:text-rise-in 820ms var(--ease) 280ms both; }
.slide.is-explaining .explainer-inner h1 { animation:text-rise-in 880ms var(--ease) 390ms both; }
.slide.is-explaining .explainer-inner .copy { animation:text-rise-in 940ms var(--ease) 520ms both; }
@keyframes text-rise-in {
  0% { opacity:0; transform:translateY(20px); filter:blur(3px); }
  100% { opacity:1; transform:translateY(0); filter:blur(0); }
}
.edge-hint { position:absolute; z-index:8; top:50%; right:0; translate:0 -50%; height:42vh; width:clamp(56px,5.5vw,84px); display:grid; place-items:center; pointer-events:none; opacity:var(--edgeOpacity,.9); transition:opacity .25s ease; }
.edge-hint span { writing-mode:vertical-rl; transform:rotate(180deg); color:rgba(255,255,255,.74); font-size:.72rem; letter-spacing:.15em; text-transform:uppercase; padding:.9rem .55rem; border:1px solid rgba(255,255,255,.16); border-right:0; border-radius:14px 0 0 14px; background:rgba(5,7,11,.48); backdrop-filter:blur(15px); box-shadow:0 14px 35px rgba(0,0,0,.27); }
.brand { position:fixed; top:0; left:0; right:0; z-index:30; display:flex; justify-content:space-between; align-items:center; padding:clamp(1rem,2vw,1.75rem) clamp(1.1rem,2.4vw,2.4rem); pointer-events:none; }
.brand .mark { font-size:.78rem; font-weight:850; letter-spacing:.14em; color:rgba(255,255,255,.74); text-transform:uppercase; pointer-events:auto; text-decoration:none; transition:color .2s ease; }
.brand .mark:hover { color:var(--aqua); }
.brand .count { font-size:.78rem; letter-spacing:.08em; color:rgba(255,255,255,.58); }
.progress { position:fixed; left:0; top:0; height:2px; width:100%; z-index:40; background:rgba(255,255,255,.08); }
.progress span { display:block; height:100%; width:10%; background:linear-gradient(90deg,var(--aqua),var(--copper)); transition:width 430ms ease; box-shadow:0 0 22px rgba(103,241,226,.35); }
.next-preview { position:fixed; left:0; right:0; bottom:0; height:min(20vh,180px); z-index:18; transform:translateY(76%); opacity:.0; transition:transform 420ms var(--ease), opacity 320ms ease; pointer-events:none; overflow:hidden; background:#05070b; box-shadow:0 -30px 70px rgba(0,0,0,.55); }
.next-preview::before { content:""; position:absolute; inset:0; z-index:2; background:linear-gradient(to bottom, rgba(5,7,11,.05), rgba(5,7,11,.66)); }
.next-preview img { width:100%; height:100%; object-fit:cover; object-position:center top; filter:brightness(.58) saturate(.92); transform:scale(1.03); }
.deck.peek-next .next-preview { transform:translateY(28%); opacity:1; }
.controls { position:fixed; left:clamp(1rem,2vw,2rem); bottom:clamp(1rem,2vw,2rem); z-index:60; display:flex; gap:.45rem; }
.controls button { appearance:none; border:1px solid rgba(255,255,255,.14); background:rgba(5,7,11,.48); color:rgba(255,255,255,.72); border-radius:999px; min-width:2.65rem; height:2.65rem; padding:0 .9rem; cursor:pointer; backdrop-filter:blur(16px); transition:background .2s, color .2s, transform .2s; }
.controls button:hover { background:rgba(103,241,226,.12); color:var(--aqua); transform:translateY(-1px); }
.mobile-note { display:none; position:fixed; right:1rem; bottom:1rem; z-index:61; color:rgba(255,255,255,.55); font-size:.75rem; }
@media (max-width: 900px), (pointer:coarse) {
  .explainer { background:rgba(5,7,11,.90); }
  .explainer-inner { width:100vw; padding:5rem 1.35rem 6.5rem; justify-content:flex-start; }
  .explainer h1 { font-size:clamp(2rem,10vw,3.6rem); max-width:12ch; }
  .copy { font-size:.96rem; line-height:1.53; }
  .edge-hint { height:36vh; width:58px; }
  .edge-hint span { font-size:.67rem; }
  .controls { display:none; }
  .mobile-note { display:block; }
  .next-preview { height:16vh; }
}
@media (prefers-reduced-motion: reduce) {
  .slide, .image-plane, .explainer, .explainer-inner, .explainer-inner .kicker, .explainer-inner h1, .explainer-inner .copy, .progress span, .next-preview { transition:none !important; }
  .slide.is-explaining .explainer-inner .kicker, .slide.is-explaining .explainer-inner h1, .slide.is-explaining .explainer-inner .copy { animation:text-fade-in 260ms ease both; }
  @keyframes text-fade-in { from { opacity:0; } to { opacity:1; } }
}
</style>
</head>
<body>
  <div class="progress" aria-hidden="true"><span></span></div>
  <header class="brand"><a class="mark" href="../" aria-label="Return to Carapace home">← CARAPACE / CORTEX</a><div class="count">01 / 10</div></header>
  <main class="deck" aria-live="polite"><div class="slides"></div><div class="next-preview" aria-hidden="true"><img alt="" /></div></main>

    <button data-prev aria-label="Previous slide">↑</button>
    <button data-reveal aria-label="Toggle explanation">Explain</button>

<script>
const slides = [{"n":1,"title":"Own Your Intelligence","img":"1.png","paras":["Every company is being told they need AI, but most AI products ask you to surrender something important: your data, your workflows, your internal knowledge, or your strategic control. Our view is different. We believe your intelligence layer should belong to you.","Carapace installs and manages a private AI operating layer for your organization. That means you can use the capabilities of frontier AI, local models, agents, and automation without being locked into one vendor or handing over the core of your business.","The important distinction is that we are model independent. We are not telling you, “Use this one model forever.” We are building the harness that lets you use the right model for the right job. Sometimes that may be GPT, Claude, Gemini, Qwen, or another frontier model. Sometimes it may be a local model running in your environment. Sometimes it may be a specialized tool or automation.","The point is control. Your business sits at the center. Carapace becomes the intelligence layer between your business and the AI ecosystem, so you can take advantage of the best available technology without giving up ownership of your data, workflows, or strategy."]},{"n":2,"title":"Your Employees Are Acting as APIs","img":"3.png","paras":["Inside most companies, the problem is not that people are lazy or incapable. The problem is that very capable people spend too much time acting as human middleware.","They copy information from one system to another. They search for files. They move things between email, spreadsheets, CRMs, folders, PDFs, Slack, Notion, accounting systems, and project tools. They chase approvals. They reformat documents. They re-enter information that already exists somewhere else.","In other words, the employee becomes the API.","That creates hidden costs: lost time, manual errors, slower execution, and frustration. People did not join the company to be human plumbing.","This is where Carapace comes in. We become the intelligence layer between people, software, and AI.","We connect tools, automate the busywork, unify information, and give people back time to focus on judgment, creativity, clients, strategy, and outcomes.","We are not replacing your team. We are removing the low-value connective tissue work that is currently draining them."]},{"n":3,"title":"What Work Shouldn’t Exist Anymore?","img":"4.png","paras":["The best automations are usually not futuristic. They are often the most boring, recurring, annoying tasks in the company, the work everyone already knows is wasteful, but no one has had the time, tools, or structure to eliminate.","So when we come into a business, one of the first questions we ask is: what work should not exist anymore?","That usually means repetitive work: copying data, weekly status updates, manual entry, and repetitive document handling.","It also means fragile work: things that depend on one person, tribal knowledge, undocumented processes, or “only Sarah knows how to do that” workflows.","There is hidden work: searching for files, digging through old proposals, hunting through email threads, or trying to find information that technically exists but is not accessible at the moment of need.","There is coordination work: approval chains, handoffs, status chasing, and work about work.","And then there is rework: formatting, corrections, rebuilding the same thing, rewriting the same email, or recreating the same report.","The goal is not to automate everything. The goal is to identify the work that drains time, creates risk, and blocks momentum.","Cortex eliminates low-value work so the team can focus on what moves the business forward."]},{"n":4,"title":"You Don’t Need an AI Department","img":"6.png","paras":["Most businesses know AI matters, but they do not have the time or internal expertise to track every model release, understand hardware requirements, compare benchmarks, evaluate privacy risks, build local infrastructure, manage API routing, configure agents, and maintain governance.","That is what we do.","We become your private AI infrastructure team.","That can include helping you select and right-size hardware. It can include local, private cloud, hybrid, or cloud deployment. It can include secure installation, configuration, integrations, data access, policies, approvals, audit logs, and continuous improvement.","You do not need to become an AI lab. You need the benefits of one.","This is where our experience becomes valuable. We are already testing models, evaluating tools, watching the frontier, comparing local options, and learning what actually works in practice. We take that moving landscape and translate it into a practical, governed stack for each client.","What the client gets is no vendor lock-in, less guesswork, fewer surprises, better visibility, and proactive support.","We handle the complexity. The client gets the competitive advantage."]},{"n":5,"title":"Your AI Should Never See Your Secrets","img":"2.png","paras":["For most companies, the hesitation is not intelligence itself. It is exposure. Passwords, API keys, client records, financial data, private files, personal information, and business strategy all become dangerous if they are casually pushed into a model context.","Cortex is designed around a simple idea: the model should only receive what it actually needs. Passwords, tokens, credentials, and sensitive information are isolated and masked until the exact moment they are required for execution. The model does not need to “know” the secret in order for the workflow to work.","That gives us a very clear principle: the model cannot leak what it never received.","This matters because we are not asking the client to trust a black box. The system is designed to be inspectable. You can verify the data path, audit what was accessed, and see how information moved through the workflow.","Because Cortex is model independent, the client is not trapped. If one provider changes its policies, pricing, availability, or suitability, the organization can route elsewhere. Local models, private cloud models, and frontier APIs can all be part of the same governed environment.","The message is simple: AI capability without surrendering data ownership, operational control, or provider choice."]},{"n":6,"title":"Trust Should Be Inspectable","img":"9.png","paras":["Every AI vendor claims security, governance, and control. The question is: can the company verify those claims?","Cortex is designed so trust is not just a promise. It is a feature.","The system is organized around inspectable layers: policies, approvals, routing, models, and audit logs.","Policies define the company’s rules and boundaries. Approvals keep humans involved where judgment matters. Routing shows why a request went to a specific model, provider, tool, or environment. The model layer remains agnostic, so work can be local, private, or frontier-based depending on need. Audit logs make the process visible after the fact.","That matters because companies do not just need AI that works. They need AI they can explain, govern, and improve.","Open governance also makes the platform more resilient. If models change, vendors shift, pricing changes, or regulations evolve, the company is not trapped. The workflow can adapt because the control layer belongs to the company.","Community tested. Company controlled.","Transparency is not something we ask clients to believe in. It is something we build into the way the system works."]},{"n":7,"title":"Control the Destination. Not the Vendor.","img":"5.png","paras":["Cortex is the control plane for AI work. Every request comes in, and Cortex decides where that request should go based on the company’s policies, security rules, cost preferences, speed requirements, context needs, and approval requirements.","That is very different from simply buying one AI product and hoping it fits every use case.","Some work should stay local. Some work can safely go to a frontier model. Some work may belong in a private cloud environment. Some work should go to a specialized tool. Some work should require approval before anything happens.","Cortex gives the company a way to define those rules.","You decide where data lives. You decide who can access what. You decide what needs approval. You decide how work gets routed. You decide what gets logged.","Then Cortex enforces those decisions.","The key sovereignty point is this: the company should control the destination, not the vendor. You should not have to reorganize your business around one AI company’s product roadmap, pricing, policy changes, outages, or limitations.","Cortex gives you the power to use any model or provider without giving up control of your data, workflows, or strategic direction."]},{"n":8,"title":"Finding the Right Model for the Right Job","img":"7.png","paras":["Every request is different.","A summarization task may not need the same model as a legal-style comparison. Extracting dates and amounts from documents is different from drafting a proposal. Fast classification is different from nuanced writing. Some work should prioritize cost. Some should prioritize quality. Some should prioritize privacy. Some should prioritize latency.","Cortex handles that routing problem.","Instead of asking employees to know which AI model to use, Cortex can map requests to capability aliases: summarize, extract data, classify, compare, draft, and so on. Behind those aliases, Carapace maintains and evaluates the model roster.","That roster can include frontier models, local models, private cloud models, open-weight models, specialized models, and future models that are not even on the market yet.","The value is not just access to models. The value is stewardship.","We test, benchmark, monitor, recommend, and update the options. Then Cortex routes work based on capability, cost, speed, context, policy, and outcome.","So instead of the client constantly asking, “Which model should we use now?” they can focus on the work.","Best outcome, automatically: right capability, right cost, right speed, right for the business."]},{"n":9,"title":"Small Wins First. Scale Later.","img":"8.png","paras":["A lot of AI initiatives fail because they start too big. They try to transform the whole company before anyone has seen practical value. That creates confusion, resistance, cost, and risk.","Our approach is the opposite: start small, prove value, then expand with confidence.","First, we discover. We look for repetitive work, information bottlenecks, SaaS overlap, security requirements, and strong automation candidates. This is where we find the leaks.","Second, we deploy. We create a private Cortex environment (local, cloud, or hybrid) with security controls, governance policies, model roster, and the right knowledge connections.","Third, we launch the first wins. These are usually one or two real workflows, not theoretical demos. It could be internal knowledge retrieval, proposal generation, approval routing, reporting automation, document processing, or another high-value workflow.","Fourth, we measure. We track hours saved, vendor costs reduced, process improvements, user adoption, and operational impact.","Fifth, we expand. Once there is evidence, then we scale into more departments, more workflows, more operators, and more integrations.","This makes adoption safer and more believable. We are not asking the client to buy a giant transformation project on faith. We are proving value on real work and growing from there."]},{"n":10,"title":"Book the Sprint. Own Your Intelligence.","img":"10.png","paras":["We do not begin by asking the client to commit to a massive transformation project. We begin with one focused engagement: the Cortex Discovery & Integration Sprint.","The Sprint is designed to produce measurable results and a clear path forward.","During the Sprint, we map the client’s workflows and identify the highest-impact opportunities for automation. We deploy a secure Cortex sandbox or private environment. We launch one to two real automations with real users and real workflows. Then we measure ROI and deliver a roadmap for what should happen next.","This gives you a practical way to evaluate Carapace without committing to everything upfront.","It is fixed in scope. It is focused on outcomes. It is designed to reveal where the company is leaking time, money, and energy, and what should be automated first.","The key promise is not “AI magic.” The promise is a private, governed intelligence layer that starts producing value in a controlled way.","No giant transformation project. No vendor lock-in. Expert-led, practitioner-delivered, measurable results, and a clear path forward.","Let’s build what shouldn’t exist anymore.","Book the Sprint. Own your intelligence."]}];
const slideOrder = [1, 3, 4, 6, 2, 9, 5, 7, 8, 10];
slides.splice(0, slides.length, ...slideOrder.map((n) => slides.find((slide) => slide.n === n)));

const deck = document.querySelector('.deck');
const progress = document.querySelector('.progress span');
const count = document.querySelector('.count');
const prevBtn = document.querySelector('[data-prev]');
const nextBtn = document.querySelector('[data-next]');
const revealBtn = document.querySelector('[data-reveal]');
const nextPreview = document.querySelector('.next-preview img');
const requestedSlide = Number.parseInt(window.location.hash.replace('#slide-', ''), 10);
let current = Number.isInteger(requestedSlide) ? clamp(requestedSlide - 1, 0, slides.length - 1) : 0;
let revealLocked = new URLSearchParams(window.location.search).get('explain') === '1';
let hoverRevealActive = false;
let isAnimating = false;
let wheelDistance = 0;
let wheelDirection = 0;
let lastWheelTime = 0;
const WHEEL_THRESHOLD = 180;
const SWIPE_THRESHOLD = 72;
let touchState = null;

function clamp(n,min,max){ return Math.max(min, Math.min(max,n)); }
function slideEl(i){ return document.querySelector(`.slide[data-index="${i}"]`); }
function nextIndex(){ return (current + 1) % slides.length; }
function escapeHTML(str){ return String(str).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }

function renderSlides(){
  const frag = document.createDocumentFragment();
  slides.forEach((s,i) => {
    const sec = document.createElement('section');
    sec.className = 'slide';
    sec.dataset.index = i;
    resetVars(sec);
    const paras = s.paras.map((p, idx) => {
      const content = idx === s.paras.length - 1 && (p.length < 70 || p.includes('Book the Sprint')) ? `<strong>${escapeHTML(p)}</strong>` : escapeHTML(p);
      return `<p>${content}</p>`;
    }).join('');
    sec.innerHTML = `
      <div class="slide-media">
        <img class="blur-bg" src="${s.img}" alt="" aria-hidden="true" draggable="false" />
        <aside class="explainer" aria-label="Slide explanation">
          <div class="explainer-inner">
            <div class="kicker">Slide ${String(s.n).padStart(2,'0')} / ${String(slides.length).padStart(2,'0')}</div>
            <h1>${escapeHTML(s.title)}</h1>
            <div class="copy">${paras}</div>
          </div>
        </aside>
        <div class="image-plane">
          <img class="slide-img" src="${s.img}" alt="${escapeHTML(s.title)}" draggable="false" />
        </div>
        <div class="vignette"></div>
        <div class="edge-hint" aria-hidden="true"><span>explain</span></div>
      </div>`;
    frag.appendChild(sec);
  });
  document.querySelector('.slides').appendChild(frag);
}

function resetVars(el){
  if(!el) return;
  el.classList.remove('is-explaining');
  el.style.setProperty('--reveal','0');
  el.style.setProperty('--rshift','0vw');
  el.style.setProperty('--px','0px');
  el.style.setProperty('--py','0px');
  el.style.setProperty('--brightness','1');
  el.style.setProperty('--saturation','1');
  el.style.setProperty('--vignetteOpacity','.84');
  el.style.setProperty('--panelOpacity','0');
  el.style.setProperty('--innerX','15vw');
  el.style.setProperty('--innerOpacity','0');
  el.style.setProperty('--edgeOpacity','.9');
  el.style.setProperty('--imgScale','1.006');
}

function applyReveal(el, reveal, x=.5, y=.5){
  reveal = clamp(reveal,0,1);
  el.classList.toggle('is-explaining', reveal > .5);
  const mobile = window.matchMedia('(max-width: 900px), (pointer:coarse)').matches;
  const shift = mobile ? -100 : -52;
  const px = ((x - .5) * (1, reveal) * 3).toFixed(2) + 'px';
  const py = ((y - .5) * (1, reveal) * 2).toFixed(2) + 'px';
  el.style.setProperty('--reveal', reveal.toFixed(3));
  el.style.setProperty('--rshift', `${shift * reveal}vw`);
  el.style.setProperty('--px', px);
  el.style.setProperty('--py', py);
  el.style.setProperty('--brightness', (1, reveal * .38).toFixed(3));
  el.style.setProperty('--saturation', (1, reveal * .13).toFixed(3));
  el.style.setProperty('--vignetteOpacity', (.84, reveal * .20).toFixed(3));
  el.style.setProperty('--panelOpacity', Math.min(1, reveal * 1.15).toFixed(3));
  el.style.setProperty('--innerX', `${15 * (1, reveal)}vw`);
  el.style.setProperty('--innerOpacity', Math.min(1, reveal * 1.3).toFixed(3));
  el.style.setProperty('--edgeOpacity', (.9, reveal * .82).toFixed(3));
  el.style.setProperty('--imgScale', (1.006, reveal * .006).toFixed(3));
}

function updateClasses(){
  document.querySelectorAll('.slide').forEach((el,i) => {
    el.classList.toggle('is-current', i === current);
    el.classList.toggle('is-next', i === nextIndex());
    el.classList.toggle('is-prev', i === current - 1 || (current === 0 && i === slides.length - 1));
    if(i !== current) resetVars(el);
  });
  deck.classList.toggle('at-end', current === slides.length - 1);
  progress.style.width = `${((current + 1) / slides.length) * 100}%`;
  count.textContent = `${String(current + 1).padStart(2,'0')} / ${String(slides.length).padStart(2,'0')}`;
  nextPreview.src = slides[nextIndex()].img;
  document.title = `${slides[current].title} | Carapace / Cortex`;
  history.replaceState(null, '', `#slide-${current + 1}`);
}

function go(target){
  if(isAnimating) return;
  target = (target + slides.length) % slides.length;
  if(target === current) return;
  isAnimating = true;
  revealLocked = false;
  hoverRevealActive = false;
  wheelDistance = 0;
  deck.classList.remove('peek-next');
  resetVars(slideEl(current));
  current = target;
  updateClasses();
  window.setTimeout(() => { isAnimating = false; }, 520);
}
function goNext(){ go(current === slides.length - 1 ? 0 : current + 1); }
function goPrev(){ go(current - 1); }

function setRevealFromPointer(e){
  if(revealLocked) return;
  const el = slideEl(current); if(!el) return;
  const x = e.clientX / window.innerWidth;
  const y = e.clientY / window.innerHeight;
  // A narrow edge trigger prevents ordinary reading movement from steering the slide.
  // Once open, keep the panel stable until the pointer leaves the text half.
  if(!hoverRevealActive && x >= .86) hoverRevealActive = true;
  if(hoverRevealActive && x < .48) hoverRevealActive = false;
  applyReveal(el, hoverRevealActive ? 1 : 0, x, y);
}
function hideReveal(){
  if(revealLocked) return;
  hoverRevealActive = false;
  resetVars(slideEl(current));
}
function toggleReveal(force){
  const el = slideEl(current); if(!el) return;
  revealLocked = typeof force === 'boolean' ? force : !revealLocked;
  hoverRevealActive = false;
  revealLocked ? applyReveal(el, 1, .96, .5) : resetVars(el);
}

function canScrollText(panel, direction){
  if(direction > 0) return panel.scrollTop + panel.clientHeight < panel.scrollHeight - 2;
  return panel.scrollTop > 2;
}

function handleWheel(e){
  if(isAnimating || Math.abs(e.deltaY) < 2) return;
  const direction = Math.sign(e.deltaY);
  const panel = e.target.closest('.explainer-inner');
  const textIsVisible = revealLocked || hoverRevealActive;

  // Scroll the explanation normally; only build slide-navigation momentum at its edge.
  if(panel && textIsVisible && canScrollText(panel, direction)){
    wheelDistance = 0;
    wheelDirection = direction;
    return;
  }

  e.preventDefault();
  const now = performance.now();
  if(direction !== wheelDirection || now, lastWheelTime > 650) wheelDistance = 0;
  wheelDirection = direction;
  lastWheelTime = now;
  wheelDistance += Math.min(Math.abs(e.deltaY), 80);

  if(wheelDistance < WHEEL_THRESHOLD) return;
  wheelDistance = 0;
  direction > 0 ? goNext() : goPrev();
}

function handleTouchStart(e){
  if(e.touches.length !== 1 || e.target.closest('button, a')){
    touchState = null;
    return;
  }
  const touch = e.touches[0];
  touchState = {
    startX:touch.clientX,
    startY:touch.clientY,
    lastY:touch.clientY,
    axis:null,
    overscroll:0,
    direction:0,
    panel:e.target.closest('.explainer-inner')
  };
}

function handleTouchMove(e){
  if(!touchState || e.touches.length !== 1 || isAnimating) return;
  const touch = e.touches[0];
  const totalX = touch.clientX, touchState.startX;
  const totalY = touch.clientY, touchState.startY;

  if(!touchState.axis){
    if(Math.abs(totalX) < 8 && Math.abs(totalY) < 8) return;
    touchState.axis = Math.abs(totalY) > Math.abs(totalX) * 1.15 ? 'vertical' : 'horizontal';
  }
  if(touchState.axis !== 'vertical') return;

  // Finger moving upward means content/slide movement toward the next item.
  const step = touchState.lastY, touch.clientY;
  const direction = Math.sign(step);
  touchState.lastY = touch.clientY;
  if(!direction) return;

  const textIsVisible = revealLocked || hoverRevealActive;
  if(touchState.panel && textIsVisible && canScrollText(touchState.panel, direction)){
    touchState.overscroll = 0;
    touchState.direction = direction;
    return;
  }

  if(e.cancelable) e.preventDefault();
  if(direction !== touchState.direction) touchState.overscroll = 0;
  touchState.direction = direction;
  touchState.overscroll += Math.abs(step);
}

function handleTouchEnd(){
  if(!touchState) return;
  const { axis, overscroll, direction } = touchState;
  touchState = null;
  if(axis !== 'vertical' || overscroll < SWIPE_THRESHOLD || isAnimating) return;
  direction > 0 ? goNext() : goPrev();
}

renderSlides();
updateClasses();
if(revealLocked) applyReveal(slideEl(current), 1, .96, .5);

document.addEventListener('mousemove', setRevealFromPointer);
document.addEventListener('mouseleave', hideReveal);
document.addEventListener('wheel', handleWheel, { passive:false });
document.addEventListener('touchstart', handleTouchStart, { passive:true });
document.addEventListener('touchmove', handleTouchMove, { passive:false });
document.addEventListener('touchend', handleTouchEnd, { passive:true });
document.addEventListener('touchcancel', () => { touchState = null; }, { passive:true });
nextBtn.addEventListener('click', goNext);
prevBtn.addEventListener('click', goPrev);
revealBtn.addEventListener('click', () => toggleReveal());

document.addEventListener('keydown', (e) => {
  if(['ArrowDown','PageDown',' ','Enter'].includes(e.key)){ e.preventDefault(); goNext(); }
  if(['ArrowUp','PageUp','Backspace'].includes(e.key)){ e.preventDefault(); goPrev(); }
  if(e.key === 'ArrowRight' || e.key.toLowerCase() === 'e'){ e.preventDefault(); toggleReveal(true); }
  if(e.key === 'ArrowLeft' || e.key === 'Escape'){ e.preventDefault(); toggleReveal(false); }
  if(e.key === 'Home'){ e.preventDefault(); go(0); }
  if(e.key === 'End'){ e.preventDefault(); go(slides.length - 1); }
});

document.addEventListener('click', (e) => {
  if(e.target.closest('button')) return;
  if(e.clientX > window.innerWidth * .72) toggleReveal();
});
window.addEventListener('hashchange', () => {
  const target = Number.parseInt(window.location.hash.replace('#slide-', ''), 10);
  if(Number.isInteger(target)) go(clamp(target - 1, 0, slides.length - 1));
});
</script>
</body>
</html>
